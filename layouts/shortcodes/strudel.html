{{- if not (.Page.Scratch.Get "strudel-embed") -}}
{{- .Page.Scratch.Set "strudel-embed" true -}}
<script src="https://unpkg.com/@strudel/embed@latest"></script>
{{- /* The embed script creates the iframe with fixed width="600" height="400"; override them to fill the container. */}}
<style>
  strudel-repl iframe { width: 100%; height: 100%; display: block; border: 0; }
</style>
{{- end }}
<strudel-repl style="display: block; height: {{ .Get "height" | default "400" }}px;">
{{ "<!--" | safeHTML }}
{{ .Inner | safeHTML }}
{{ "-->" | safeHTML }}
</strudel-repl>
